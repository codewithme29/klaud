services:
  - type: web
    name: klaud-hunter
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
